<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قريباً — أكاديمية المهن الذكية</title>
<meta name="description" content="نعمل على إطلاق هذا القسم قريباً. تواصل معنا للحصول على آخر التحديثات.">
<meta name="theme-color" content="#FAF7F0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/animations.css">
<link rel="stylesheet" href="../assets/css/pages.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23C9A84C'/%3E%3Ctext x='50' y='66' font-family='Cairo, sans-serif' font-size='44' font-weight='900' text-anchor='middle' fill='%231A1610'%3EICA%3C/text%3E%3C/svg%3E">
</head>
<body>

<a href="#main" class="skip-link">انتقل إلى المحتوى الرئيسي</a>
<div data-include="navbar"></div>

<main id="main">

  <section class="coming-soon">
    <!-- Decorative background rings -->
    <div class="shape-ring" style="width:520px;height:520px;top:50%;left:50%;transform:translate(-50%,-50%);" aria-hidden="true"></div>
    <div class="shape-ring shape-ring-rev" style="width:340px;height:340px;top:50%;left:50%;transform:translate(-50%,-50%);border-color:rgba(201,168,76,0.10);" aria-hidden="true"></div>

    <div class="coming-soon-inner">
      <div class="coming-soon-icon" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>

      <div class="badge animate-on-load delay-1" style="margin-bottom:var(--space-md);">
        <span class="badge-dot" aria-hidden="true"></span>
        قيد الإعداد
      </div>

      <h1 class="animate-on-load delay-2">
        محتوى <span data-coming-context>هذا القسم</span> <br>
        <span class="text-gradient">قريباً</span>
      </h1>

      <p class="animate-on-load delay-3">
        نعمل بكل جدّ على إعداد هذا المحتوى ليكون بأعلى مستوى من الجودة.
        تابعنا لتكون أوّل من يعرف عند الإطلاق.
      </p>

      <div class="coming-soon-actions animate-on-load delay-4">
        <button onclick="history.back()" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
          العودة للخلف
        </button>
        <a href="../index.html" class="btn btn-secondary">الصفحة الرئيسية</a>
        <a href="consultation.html" class="btn btn-ghost">طلب استشارة</a>
      </div>
    </div>
  </section>

</main>

<div data-include="footer"></div>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/animations.js"></script>
</body>
</html>
